
<!DOCTYPE html>
<html>
<head>
<title>Register</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(120deg, rgb(84, 11, 152), rgb(15, 150, 15), rgb(133, 61, 73));
}

nav {
    background: rgb(135, 135, 12);
    padding: 18px;
    text-align: center;
}

nav a {
    color: rgb(183, 177, 177);
    text-decoration: none;
    margin: 20px;
    font-size: 17px;
}

nav a:hover {
    color: rgb(157, 19, 19);
}

.form-box {
    width: 400px;
    margin: 45px auto;
    padding: 25px;
    background: rgb(133, 72, 72);
    border-radius: 15px;
    box-shadow: 0 5px 20px rgb(14, 1, 1);
}

label {
    color: rgb(7, 62, 7);
    font-weight: bold;
}

input[type="text"],
input[type="email"],
input[type="password"] {
    width: 95%;
    padding: 11px;
    margin: 10px 0 18px;
    border: 2px solid rgb(59, 16, 100);
    border-radius: 7px;
}

input:focus {
    outline: none;
    border-color: rgb(138, 92, 6);
}

button {
    background: linear-gradient(90deg, rgb(153, 37, 37), rgb(168, 168, 79));
    color: rgb(212, 203, 203);
    border: none;
    padding: 12px 35px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: rgb(147, 108, 58);
}

@media(max-width: 500px) {
    .form-box {
        width: auto;
        margin: 25px 15px;
    }

    nav a {
        margin: 5px;
        font-size: 14px;
    }
}
</style>
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
</nav>

<div class="form-box">

<form>

<label>First Name</label>
<input type="text" placeholder="First Name">

<label>Last Name</label>
<input type="text" placeholder="Last Name">

<label>Gender</label><br>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female

<br><br>

<label>Interests</label><br>
<input type="checkbox"> Riding
<input type="checkbox"> Hiking
<input type="checkbox"> Traveling

<br><br>

<label>Email</label>
<input type="email" placeholder="Enter Email">

<label>Password</label>
<input type="password" placeholder="Enter Password">

<center>
<button type="submit">Register</button>
</center>

</form>
</div>

</body>
</html>
